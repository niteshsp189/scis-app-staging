name: Build and Deploy React App to S3

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1        
      S3_BUCKET: scis-frontend-app-433948387846  
      SECRET_ID: scis/prod/BACKEND_URL 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CLI (if not already available)
        run: |
          if ! command -v aws &> /dev/null
          then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get API base URL from Secrets Manager
        id: get_secret
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text)

          API_BASE_URL=$(echo "$SECRET_JSON" | jq -r '.apiBaseUrl')

          # export for later steps
          echo "API_BASE_URL=$API_BASE_URL" >> $GITHUB_ENV

          # print it to the logs so you can see it
          echo "Resolved API_BASE_URL: $API_BASE_URL"

      # 🔍 optional but very useful: verify the URL / health endpoint
      - name: Check API health (optional)
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          echo "Calling ${API_BASE_URL}/api/health"
          curl -v "${API_BASE_URL}/api/health" || echo "Health check failed (but continuing)"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_API_URL: ${{ env.API_BASE_URL }}
        run: |
          echo "Building with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" --delete